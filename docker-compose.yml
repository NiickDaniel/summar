services:
  backend:
    build:
      context: ./backend
    container_name: summar-backend
    env_file:
      - ./backend/.env
    ports:
      - "3000:3000"
    networks:
      - summar-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: summar-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - summar-network
    restart: unless-stopped

networks:
  summar-network:
    driver: bridge
